<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Activity 11 - Array Random Name Picker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Random Name Picker</h1>

    <textarea id="namesInput" placeholder="Enter names separated by commas or new Lines"></textarea>

    <div class="button-group">
        <button onclick="pickRandomName()">Pick a Random Name</button>
        <button class="clear-btn" onclick="clearNames()">Clear Names</button>
    </div>

    <div id="infoDisplay"></div>
    <div id="nameDisplay"></div>
</body>
</html>
